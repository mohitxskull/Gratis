<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>proton-proxy</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1.05rem; margin-top: 2rem; }
  table { border-collapse: collapse; width: 100%; margin-top: 0.5rem; }
  th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; font-size: 0.9rem; }
  th { background: #f2f2f2; }
  button { cursor: pointer; padding: 0.2rem 0.6rem; }
  input { padding: 0.3rem; margin-right: 0.5rem; }
  #login-status, #msg { font-size: 0.85rem; margin-top: 0.4rem; min-height: 1.2em; }
  .err { color: #b00020; }
  .ok { color: #067d17; }
  code { background: #f2f2f2; padding: 0.1rem 0.3rem; }
</style>
</head>
<body>
<h1>proton-proxy</h1>

<h2>Login</h2>
<form id="login-form">
  <input type="email" id="email" placeholder="email" required>
  <input type="password" id="password" placeholder="password" required>
  <button type="submit">Log in</button>
</form>
<div id="login-status"></div>

<h2>Locations</h2>
<button id="refresh-locations">Refresh locations</button>
<table id="locations-table">
  <thead><tr><th>Code</th><th>Country</th><th>Load</th><th></th></tr></thead>
  <tbody></tbody>
</table>

<h2>Active tunnels</h2>
<button id="refresh-tunnels">Refresh tunnels</button>
<table id="tunnels-table">
  <thead><tr><th>Location</th><th>Interface</th><th>SOCKS5 URL</th><th>Connected</th><th></th></tr></thead>
  <tbody></tbody>
</table>

<div id="msg"></div>

<script>
function msg(text, isErr) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = isErr ? 'err' : 'ok';
}

async function api(path, opts) {
  const resp = await fetch(path, opts);
  let body = null;
  try { body = await resp.json(); } catch (e) { /* empty body is fine */ }
  if (!resp.ok) {
    const errText = (body && body.error) ? body.error : ('HTTP ' + resp.status);
    throw new Error(errText);
  }
  return body;
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const statusEl = document.getElementById('login-status');
  statusEl.textContent = 'Logging in...';
  statusEl.className = '';
  try {
    await api('/api/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    statusEl.textContent = 'Logged in.';
    statusEl.className = 'ok';
    await loadLocations();
    await loadTunnels();
  } catch (err) {
    statusEl.textContent = 'Login failed: ' + err.message;
    statusEl.className = 'err';
  }
});

async function loadLocations() {
  const tbody = document.querySelector('#locations-table tbody');
  try {
    const locations = await api('/api/locations');
    tbody.innerHTML = '';
    for (const loc of locations) {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + escapeHtml(loc.code) + '</td>' +
        '<td>' + escapeHtml(loc.name) + '</td>' +
        '<td>' + loc.load + '</td>' +
        '<td><button data-code="' + escapeHtml(loc.code) + '" class="start-btn">Start</button></td>';
      tbody.appendChild(tr);
    }
    document.querySelectorAll('.start-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        try {
          await api('/api/tunnels', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ location: btn.dataset.code }),
          });
          msg('Started ' + btn.dataset.code, false);
          await loadTunnels();
        } catch (err) {
          msg('Start failed: ' + err.message, true);
        }
      });
    });
  } catch (err) {
    msg('Failed to load locations: ' + err.message, true);
  }
}

async function loadTunnels() {
  const tbody = document.querySelector('#tunnels-table tbody');
  try {
    const tunnels = await api('/api/tunnels');
    tbody.innerHTML = '';
    for (const t of tunnels) {
      const url = 'socks5://127.0.0.1:' + t.socks_port;
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + escapeHtml(t.location) + '</td>' +
        '<td>' + escapeHtml(t.interface) + '</td>' +
        '<td><code>' + url + '</code> <button class="copy-btn" data-url="' + url + '">Copy</button></td>' +
        '<td>' + (t.connected ? 'yes' : 'no') + '</td>' +
        '<td><button class="stop-btn" data-loc="' + escapeHtml(t.location) + '">Stop</button></td>';
      tbody.appendChild(tr);
    }
    document.querySelectorAll('.copy-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(btn.dataset.url);
          msg('Copied ' + btn.dataset.url, false);
        } catch (err) {
          msg('Copy failed: ' + err.message, true);
        }
      });
    });
    document.querySelectorAll('.stop-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        try {
          await api('/api/tunnels/' + encodeURIComponent(btn.dataset.loc), { method: 'DELETE' });
          msg('Stopped ' + btn.dataset.loc, false);
          await loadTunnels();
        } catch (err) {
          msg('Stop failed: ' + err.message, true);
        }
      });
    });
  } catch (err) {
    msg('Failed to load tunnels: ' + err.message, true);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

document.getElementById('refresh-locations').addEventListener('click', loadLocations);
document.getElementById('refresh-tunnels').addEventListener('click', loadTunnels);

loadTunnels();
</script>
</body>
</html>
