[package]
name = "gratis"
version = "0.2.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
repository = "https://github.com/mohitxskull/Gratis"
description = "No-root Proton VPN (free tier) client — every server exposed as its own lazily-connecting, self-idling local SOCKS5 proxy."

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# WHY pgpinternal: supplies RPGPVerifier to verify the PGP-signed SRP modulus Proton
# requires before trusting it. Correctness reference for the auth/session flow:
# https://github.com/ProtonVPN/proton-vpn-cli
proton-srp = { version = "0.8", features = ["pgpinternal"] }
axum = "0.7"
# WHY: the WireGuard client identity is generated locally, never issued by the server (Proton
# hands back a signed certificate for a client-supplied public key, not a private key) —
# verified against the official proton-vpn-api-core client's key_mgr.py/credentials.py.
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
# WHY: verified live (raw handshake + real HTTP request/response through a tunnel built with
# this exact key/config shape) that Proton routes real internet traffic through a bare
# WireGuard session with no additional "Local Agent" step. This lets the daemon speak
# WireGuard entirely in-process — no root, no `sudo wg-quick`, no real network interface, no
# `SO_BINDTODEVICE` — which is a much better fit for "just run the binary" than the
# root-requiring design the plan originally specified.
wireguard-netstack = "0.3"
async-trait = "0.1"
askama = "0.16"
env_logger = "0.11.11"
# WHY: implements Proton's "local agent" handshake (see `agent.rs`) — client-cert TLS to
# 10.2.0.1:65432 through the userspace tunnel, which is what actually lifts Proton's
# restricted-session block instead of waiting it out. Pinned to the same rustls major `reqwest`
# already pulls in via its `rustls-tls` feature (see the lockfile) so there is only ever one
# rustls dependency graph in the binary, not two competing majors.
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"

[dev-dependencies]
base64 = "0.22"
tempfile = "3"
tower = { version = "0.4", features = ["util"] }

[profile.release]
# dev tool; keep default.
