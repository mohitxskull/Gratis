[package]
name = "proton-proxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
# WHY pgpinternal: supplies RPGPVerifier to verify the PGP-signed SRP modulus Proton
# requires before trusting it. Correctness reference for the auth/session flow:
# https://github.com/ProtonVPN/proton-vpn-cli
proton-srp = { version = "0.8", features = ["pgpinternal"] }

[dev-dependencies]
base64 = "0.22"

[profile.release]
# dev tool; keep default.
