[package]
name = "gratis"
version = "0.5.1"
edition = "2024"
rust-version = "1.94.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/mohitxskull/Gratis"
description = "A local SOCKS5 proxy over your Proton VPN account's servers — no root required, every reachable server its own lazily-connecting, self-idling proxy port."

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# WHY pgpinternal: supplies RPGPVerifier to verify the PGP-signed SRP modulus Proton
# requires before trusting it. Correctness reference for the auth/session flow:
# https://github.com/ProtonVPN/proton-vpn-cli
proton-srp = { version = "0.8", features = ["pgpinternal"] }
axum = "0.7"
# WHY: the WireGuard client identity is generated locally, never issued by the server (Proton
# hands back a signed certificate for a client-supplied public key, not a private key) —
# verified against the official proton-vpn-api-core client's key_mgr.py/credentials.py.
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
# WHY: verified live (raw handshake + real HTTP request/response through a tunnel built with
# this exact key/config shape) that Proton routes real internet traffic through a bare
# WireGuard session with no additional "Local Agent" step. This lets the daemon speak
# WireGuard entirely in-process — no root, no `sudo wg-quick`, no real network interface, no
# `SO_BINDTODEVICE` — which is a much better fit for "just run the binary" than the
# root-requiring design the plan originally specified.
wireguard-netstack = "0.3"
async-trait = "0.1"
askama = "0.16"
env_logger = "0.11.11"
log = "0.4"
# WHY: implements Proton's "local agent" handshake (see `agent.rs`) — client-cert TLS to
# 10.2.0.1:65432 through the userspace tunnel, which is what actually lifts Proton's
# restricted-session block instead of waiting it out. Pinned to the same rustls major `reqwest`
# already pulls in via its `rustls-tls` feature (see the lockfile) so there is only ever one
# rustls dependency graph in the binary, not two competing majors.
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
# WHY v1: keyring 4's default (unversioned) API changed shape from the 3.x line most
# examples reference; the `v1` feature keeps the familiar Entry::new/get_password/
# set_password/delete_credential surface. zbus-secret-service-keyring-store is the pure-Rust
# (no libsecret/D-Bus C bindings) backend that talks to the Secret Service over D-Bus.
keyring = { version = "4.1.6", default-features = false, features = ["v1", "zbus-secret-service-keyring-store"] }
console = "0.16.4"
notify-rust = { version = "4.18.0", default-features = false, features = ["zbus", "serde", "async"] }
# WHY async-io (not ksni's default "tokio" feature): zbus is a shared dependency (keyring,
# notify-rust) already on its async-io backend. Cargo unifies feature flags across a single
# crate version, so ksni's "tokio" feature would flip that SAME zbus onto its tokio backend
# for every user of it — which broke keyring's blocking Secret Service calls: zbus's
# tokio-backed `block_on` tries to spin up its own nested Tokio runtime, and panics
# ("Cannot start a runtime from within a runtime") the moment it's called from inside our
# own `#[tokio::main]`. Verified live: `gratis login`/`logout` reproduced this immediately
# after adding ksni with defaults, and it disappeared switching ksni to async-io.
ksni = { version = "0.3.6", default-features = false, features = ["async-io"] }

[dev-dependencies]
base64 = "0.22"
tempfile = "3"
tower = { version = "0.4", features = ["util"] }

[profile.release]
# dev tool; keep default.

[profile.dev]
# Full DWARF debug info is the single biggest driver of target/debug size for a dependency
# tree this large (wireguard-netstack, zbus, the rustls stack, ...). Line tables are enough
# for backtraces/line numbers in `cargo test`/`cargo run` output — this project doesn't rely
# on full local-variable inspection in a debugger.
debug = "line-tables-only"
