<div class="border border-ink/10 rounded divide-y divide-ink/10 bg-paper">
  {% for t in tunnels %}
  <div class="flex items-center justify-between px-4 py-3">
    <div class="flex items-center gap-4 min-w-0">
      <span class="font-mono text-sm text-ink">{{ t.location }}</span>
      <span class="font-mono text-xs text-ink/55 truncate">socks5://127.0.0.1:{{ t.socks_port }}</span>
      <button
        onclick="navigator.clipboard.writeText('socks5://127.0.0.1:{{ t.socks_port }}')"
        class="text-xs text-ink/40 hover:text-ink transition"
        title="Copy"
      >copy</button>
    </div>
    <div class="flex items-center gap-4 shrink-0">
      <span class="flex items-center text-xs text-ink/55">
        {% if t.connected %}
        <span class="inline-block w-1.5 h-1.5 rounded-full bg-ink mr-1.5"></span>connected
        {% else %}
        <span class="inline-block w-1.5 h-1.5 rounded-full border border-ink/40 mr-1.5"></span>stopped
        {% endif %}
      </span>
      <button
        hx-post="/ui/tunnels/{{ t.location }}/stop"
        hx-target="#tunnels"
        hx-swap="innerHTML"
        hx-disabled-elt="this"
        class="text-xs uppercase tracking-wide border border-ink/25 rounded px-3 py-1 hover:bg-ink hover:text-paper transition disabled:opacity-40"
      >Stop</button>
    </div>
  </div>
  {% endfor %}
  {% if tunnels.is_empty() %}
  <div class="py-6 text-center text-ink/40 text-sm">No active tunnels — start one from Locations below.</div>
  {% endif %}
</div>
