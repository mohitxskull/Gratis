<div class="border border-black/10 rounded divide-y divide-black/10">
  {% for t in tunnels %}
  <div class="flex items-center justify-between px-4 py-3">
    <div class="flex items-center gap-4 min-w-0">
      <span class="font-mono text-sm text-black/90">{{ t.location }}</span>
      <span class="font-mono text-xs text-black/50 truncate">socks5://127.0.0.1:{{ t.socks_port }}</span>
      <button
        onclick="navigator.clipboard.writeText('socks5://127.0.0.1:{{ t.socks_port }}')"
        class="text-xs text-black/30 hover:text-black transition"
        title="Copy"
      >copy</button>
    </div>
    <div class="flex items-center gap-4 shrink-0">
      <span class="flex items-center text-xs text-black/50">
        {% if t.connected %}
        <span class="inline-block w-1.5 h-1.5 rounded-full bg-black mr-1.5"></span>connected
        {% else %}
        <span class="inline-block w-1.5 h-1.5 rounded-full border border-black/30 mr-1.5"></span>stopped
        {% endif %}
      </span>
      <button
        hx-post="/ui/tunnels/{{ t.location }}/stop"
        hx-target="#tunnels"
        hx-swap="innerHTML"
        class="text-xs uppercase tracking-wide border border-black/20 rounded px-3 py-1 hover:bg-black hover:text-white transition"
      >Stop</button>
    </div>
  </div>
  {% endfor %}
  {% if tunnels.is_empty() %}
  <div class="py-6 text-center text-black/30 text-sm">No active tunnels — start one from Locations below.</div>
  {% endif %}
</div>
