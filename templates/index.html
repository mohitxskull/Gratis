<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gratis</title>
<style>{{ tailwind_css|safe }}</style>
</head>
<body class="bg-paper text-ink min-h-screen antialiased font-sans">
<div class="max-w-3xl mx-auto px-6 py-12">

  <header class="mb-12 border-b border-ink/10 pb-6">
    <h1 class="text-3xl font-semibold tracking-tight">Gratis</h1>
  </header>

  {% if let Some(err) = login_error %}
  <div class="border border-ink/15 bg-paper-dim rounded p-4 text-sm mb-10">
    <span class="font-semibold">Login failed.</span> <span class="text-ink/65">{{ err }}</span>
  </div>
  {% endif %}

  <section class="mb-12">
    <div class="flex items-baseline justify-between mb-4">
      <h2 class="text-xs font-semibold tracking-widest uppercase text-ink/50">Active tunnels</h2>
      <button
        hx-get="/ui/tunnels"
        hx-target="#tunnels"
        hx-swap="innerHTML"
        hx-indicator="#tunnels-spinner"
        hx-disabled-elt="this"
        class="flex items-center gap-1.5 text-xs uppercase tracking-wide text-ink/50 hover:text-ink transition disabled:opacity-40"
      >
        <svg id="tunnels-spinner" class="htmx-indicator spinner w-3 h-3" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" stroke-opacity="0.25"/>
          <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>
        Refresh
      </button>
    </div>
    <div
      id="tunnels"
      hx-get="/ui/tunnels"
      hx-trigger="every 3s"
      hx-swap="innerHTML"
    >
      {% include "tunnels.html" %}
    </div>
  </section>

  <section>
    <div class="flex items-baseline justify-between mb-4">
      <h2 class="text-xs font-semibold tracking-widest uppercase text-ink/50">Locations</h2>
      <button
        hx-get="/ui/locations"
        hx-target="#locations"
        hx-swap="innerHTML"
        hx-indicator="#locations-spinner"
        hx-disabled-elt="this"
        class="flex items-center gap-1.5 text-xs uppercase tracking-wide text-ink/50 hover:text-ink transition disabled:opacity-40"
      >
        <svg id="locations-spinner" class="htmx-indicator spinner w-3 h-3" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" stroke-opacity="0.25"/>
          <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>
        Refresh
      </button>
    </div>
    <input
      type="text"
      placeholder="Filter by code or country…"
      oninput="filterLocations(this.value)"
      class="w-full bg-paper border border-ink/20 rounded px-3 py-2 text-sm placeholder-ink/40 mb-3 focus:outline-none focus:border-ink/60 focus:ring-1 focus:ring-ink/20"
    >
    <div id="locations">
      {% include "locations.html" %}
    </div>
  </section>

</div>
<script>{{ htmx_js|safe }}</script>
<script>
function filterLocations(query) {
  const q = query.trim().toLowerCase();
  document.querySelectorAll('#locations details[data-code]').forEach((row) => {
    const match = row.dataset.code.includes(q) || row.dataset.name.includes(q);
    row.classList.toggle('hidden', !match);
  });
}
</script>
</body>
</html>
