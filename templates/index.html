<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gratis</title>
<style>{{ tailwind_css|safe }}</style>
</head>
<body class="bg-paper text-ink min-h-screen antialiased font-sans">
<div class="max-w-3xl mx-auto px-6 py-12">

  <header class="mb-12 border-b border-ink/10 pb-6">
    <h1 class="text-3xl font-semibold tracking-tight">Gratis</h1>
    <p class="text-sm text-ink/50 mt-1">Each server below has its own fixed SOCKS5 port — connect to it and the tunnel comes up on its own.</p>
  </header>

  <section>
    <div class="flex items-baseline justify-between mb-4">
      <h2 class="text-xs font-semibold tracking-widest uppercase text-ink/50">Servers</h2>
      <button
        hx-get="/ui/servers"
        hx-target="#servers"
        hx-swap="innerHTML"
        hx-indicator="#servers-spinner"
        hx-disabled-elt="this"
        class="flex items-center gap-1.5 text-xs uppercase tracking-wide text-ink/50 hover:text-ink transition disabled:opacity-40 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink/30"
      >
        <svg id="servers-spinner" class="htmx-indicator spinner w-3 h-3" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" stroke-opacity="0.25"/>
          <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>
        Refresh
      </button>
    </div>
    <input
      type="text"
      placeholder="Filter by code, name, or country…"
      oninput="filterServers(this.value)"
      class="w-full bg-paper border border-ink/20 rounded px-3 py-2 text-sm placeholder-ink/40 mb-3 focus:outline-none focus:border-ink/60 focus:ring-1 focus:ring-ink/20"
    >
    <div
      id="servers"
      hx-get="/ui/servers"
      hx-trigger="every 3s[!(document.activeElement && document.activeElement.closest('#servers'))]"
      hx-swap="innerHTML"
    >
      {% include "servers.html" %}
    </div>
    <div id="servers-empty" class="hidden py-6 text-center text-ink/40 text-sm">No servers match your filter.</div>
  </section>

</div>
<script>{{ htmx_js|safe }}</script>
<script>
let serverFilter = '';

function filterServers(query) {
  serverFilter = query.trim().toLowerCase();
  applyServerFilter();
}

// Re-applies the current filter after any htmx swap of #servers — the "Refresh" button and the
// 3s poll both replace rows there, which would otherwise silently drop the filter.
function applyServerFilter() {
  const rows = document.querySelectorAll('#servers > div');
  let anyVisible = false;
  rows.forEach((row) => {
    const text = row.textContent.toLowerCase();
    const match = text.includes(serverFilter);
    row.classList.toggle('hidden', !match);
    if (match) anyVisible = true;
  });
  document.getElementById('servers-empty').classList.toggle('hidden', rows.length === 0 || anyVisible || serverFilter === '');
}

document.body.addEventListener('htmx:afterSwap', (e) => {
  if (e.target.id === 'servers') applyServerFilter();
});
</script>
</body>
</html>
