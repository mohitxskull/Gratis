<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gratis</title>
<style>{{ tailwind_css|safe }}</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
<div class="max-w-3xl mx-auto p-6 space-y-8">

  <header>
    <h1 class="text-2xl font-bold text-blue-400">gratis</h1>
    <p class="text-sm text-gray-500 mt-1">
      Logged in automatically from <code class="bg-gray-800 px-1 rounded">.env</code> at startup — no root, no CLI login.
    </p>
  </header>

  {% if let Some(err) = login_error %}
  <div class="bg-red-950 border border-red-800 text-red-300 rounded-lg p-4 text-sm">
    <strong>Login failed:</strong> {{ err }}
  </div>
  {% endif %}

  <section>
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-lg font-semibold">Locations</h2>
      <button
        hx-get="/ui/locations"
        hx-target="#locations"
        hx-swap="innerHTML"
        class="text-sm px-3 py-1.5 rounded bg-gray-800 hover:bg-gray-700 transition"
      >Refresh</button>
    </div>
    <div id="locations" class="bg-gray-900 rounded-lg p-4">
      {% include "locations.html" %}
    </div>
  </section>

  <section>
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-lg font-semibold">Active tunnels</h2>
      <button
        hx-get="/ui/tunnels"
        hx-target="#tunnels"
        hx-swap="innerHTML"
        class="text-sm px-3 py-1.5 rounded bg-gray-800 hover:bg-gray-700 transition"
      >Refresh</button>
    </div>
    <div id="tunnels" class="bg-gray-900 rounded-lg p-4">
      {% include "tunnels.html" %}
    </div>
  </section>

</div>
<script>{{ htmx_js|safe }}</script>
</body>
</html>
