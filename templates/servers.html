<ul class="text-sm divide-y divide-ink/8">
  {% for s in servers %}
  <li class="flex items-center justify-between py-1.5">
    <span class="font-mono text-ink/75">{{ s.name }}</span>
    <span class="text-ink/50 tabular-nums text-xs">{{ s.load }}% load</span>
  </li>
  {% endfor %}
  {% if servers.is_empty() %}
  <li class="py-1.5 text-ink/40">No servers found.</li>
  {% endif %}
</ul>
