<ul id="servers-{{ location }}" hx-swap-oob="true" class="text-sm divide-y divide-ink/8">
  {% for s in servers %}
  <li class="flex items-center justify-between py-1.5 gap-3">
    <span class="font-mono text-ink/75 truncate">{{ s.name }}</span>
    <span class="flex items-center gap-3 shrink-0">
      <span class="text-ink/50 tabular-nums text-xs">{{ s.load }}% load</span>
      {% if s.connected %}
      <span class="flex items-center gap-1.5 text-xs uppercase tracking-wide text-ink/50 border border-ink/15 rounded px-2.5 py-0.5">
        <span class="inline-block w-1.5 h-1.5 rounded-full bg-ink"></span>Connected
      </span>
      {% else %}
      <button
        hx-post="/ui/tunnels/{{ location }}/start/{{ s.name|urlencode_strict }}"
        hx-target="#tunnels"
        hx-swap="innerHTML"
        hx-disabled-elt="this"
        class="text-xs uppercase tracking-wide border border-ink/25 rounded px-2.5 py-0.5 hover:bg-ink hover:text-paper transition disabled:opacity-40"
      >Connect</button>
      {% endif %}
    </span>
  </li>
  {% endfor %}
  {% if servers.is_empty() %}
  <li class="py-1.5 text-ink/40">No servers found.</li>
  {% endif %}
</ul>
