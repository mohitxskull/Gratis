<div class="border border-black/10 rounded divide-y divide-black/10">
  {% for loc in locations %}
  <details class="group" data-code="{{ loc.code|lower }}" data-name="{{ loc.name|lower }}">
    <summary class="flex items-center justify-between px-4 py-3 cursor-pointer select-none hover:bg-black/[0.03] list-none [&::-webkit-details-marker]:hidden">
      <span class="flex items-center gap-3 min-w-0">
        <svg class="w-3 h-3 text-black/30 shrink-0 transition-transform group-open:rotate-90" viewBox="0 0 8 8" fill="currentColor"><path d="M1 0l6 4-6 4z"/></svg>
        <span class="font-mono text-sm text-black/90">{{ loc.code }}</span>
        <span class="text-sm text-black/50 truncate">{{ loc.name }}</span>
      </span>
      <span class="flex items-center gap-4 shrink-0">
        <span class="text-xs text-black/40 tabular-nums">{{ loc.load }}%</span>
        <button
          hx-post="/ui/tunnels/{{ loc.code }}/start"
          hx-target="#tunnels"
          hx-swap="innerHTML"
          onclick="event.stopPropagation()"
          class="text-xs uppercase tracking-wide border border-black/20 rounded px-3 py-1 hover:bg-black hover:text-white transition"
        >Start</button>
      </span>
    </summary>
    <div
      hx-get="/ui/locations/{{ loc.code }}/servers"
      hx-trigger="toggle once"
      hx-swap="innerHTML"
      class="px-4 pb-3 pl-10 text-black/30 text-xs"
    >Loading…</div>
  </details>
  {% endfor %}
  {% if locations.is_empty() %}
  <div class="py-6 text-center text-black/30 text-sm">No locations available — is the daemon logged in?</div>
  {% endif %}
</div>
